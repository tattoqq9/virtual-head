name: 不具合報告
description: Virtual Headの再現可能な問題を報告します
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: ログやJSONに含まれるユーザー名、ファイルパス、個人情報を削除してから投稿してください。脆弱性は公開IssueではなくSecurity Advisoryを使用してください。
  - type: input
    id: version
    attributes:
      label: Virtual Headのバージョン
      placeholder: 0.1.0-alpha.6
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windowsのバージョン
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: input
    attributes:
      label: 入力方法
      options: [画像, 動画, カメラ]
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: 実行デバイス
      options: [CPU, NVIDIA GPU / CUDA]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 問題が起きるまでの操作を順番に記載してください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した動作
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 確認済みのログ
      description: 個人情報を削除したapp.logまたはrun.jsonの必要部分だけを貼り付けてください。
      render: shell
